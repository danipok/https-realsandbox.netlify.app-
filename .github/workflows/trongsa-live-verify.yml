name: Trongsa live verification

on:
  push:
    branches:
      - trongsa-live-verify-20260825

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Compare current and prior Netlify deploys
        shell: bash
        run: |
          set -u
          for base in \
            "https://trongsawords.quest" \
            "https://6a8c8a3311a88f8a57894f49--trongsa-words.netlify.app" \
            "https://6a8d16ae5b05b505fe0efe3e--trongsa-words.netlify.app"; do
            echo "=== $base ==="
            for p in index.html sw.js manifest.webmanifest assets/favicon.png assets/apple-touch-icon.png assets/icon-192.png assets/icon-512.png assets/og-preview.png; do
              tmp=$(mktemp)
              code=$(curl --silent --show-error --location --output "$tmp" --write-out '%{http_code}' "$base/$p" || true)
              size=$(stat -c '%s' "$tmp" 2>/dev/null || echo 0)
              sha=$(sha256sum "$tmp" 2>/dev/null | awk '{print $1}')
              echo "$code $size $sha $p"
              rm -f "$tmp"
            done
          done
